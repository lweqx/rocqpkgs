concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref }}
jobs:
  CakeMLExtraction:
    needs:
    - coq
    - equations
    - metarocq-erasure-plugin
    - ceres-bs
    runs-on: ubuntu-latest
    steps:
    - name: Creating the nixpkgs entrypoint expression file and builder script
      run: |-
        echo 'args:
        let
          rocqpkgs = builtins.getFlake "path:/nix/store/4gfmzb8zxw98gx802nqncy0617zixrik-source?narHash=sha256-xMP4fjCSDLPTgsI32WqxIsJY2ltnvPPcz/V1Dk73EsM=";
          system = "x86_64-linux";
        in
        import /nix/store/1l7fpy7c1q333ks4gxf32rlg7lz8c38g-398fqjqkp383m7pyla9nxpi1is5vzywh-source {
          inherit system;
          overlays = [
            (_: _: rocqpkgs.packages.${system})
          ];
        }
        // args
        ' > /tmp/nixpkgs-toolbox-entry.nix

          echo '#!/bin/bash
        nix-build \
          --extra-experimental-features flakes \
          --expr "import (builtins.getFlake '\'''\''$(readlink -f .)'\'''\'').inputs.coq-nix-toolbox" \
          --arg src ./. \
          --arg nixpkgs /tmp/nixpkgs-toolbox-entry.nix \
          "$@"
        ' > /tmp/builder.sh

          chmod +x /tmp/builder.sh
    - name: Determine which commit to initially checkout
      run: |
        if [ ${{ github.event_name }} = "push" ]; then
          echo "target_commit=${{ github.sha }}" >> $GITHUB_ENV
        else
          echo "target_commit=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
        fi
    - name: Git checkout
      uses: actions/checkout@v7
      with:
        allow-unsafe-pr-checkout: true
        fetch-depth: 0
        ref: ${{ env.target_commit }}
    - name: Determine which commit to test
      run: |
        if [ ${{ github.event_name }} = "push" ]; then
          echo "tested_commit=${{ github.sha }}" >> $GITHUB_ENV
        else
          merge_commit=$(git ls-remote ${{ github.event.repository.html_url }} refs/pull/${{ github.event.number }}/merge | cut -f1)
          mergeable=$(git merge --no-commit --no-ff ${{ github.event.pull_request.base.sha }} > /dev/null 2>&1; echo $?; git merge --abort > /dev/null 2>&1 || true)
          if [ -z "$merge_commit" -o "x$mergeable" != "x0" ]; then
            echo "tested_commit=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          else
            echo "tested_commit=$merge_commit" >> $GITHUB_ENV
          fi
        fi
    - name: Git checkout
      uses: actions/checkout@v7
      with:
        allow-unsafe-pr-checkout: true
        fetch-depth: 0
        ref: ${{ env.tested_commit }}
    - name: Cachix install
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixpkgs-unstable
    - name: Cachix setup coq-community
      uses: cachix/cachix-action@v16
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        extraPullNames: coq, math-comp
        name: coq-community
    - id: stepGetDerivation
      name: Getting derivation for current job (CakeMLExtraction)
      run: |
        NIXPKGS_ALLOW_UNFREE=1 /tmp/builder.sh --no-out-link \
           --argstr bundle "9.2" --argstr job "CakeMLExtraction" \
           --dry-run 2> err > out || (touch fail; true)
        cat out err
        if [ -e fail ]; then echo "Error: getting derivation failed"; exit 1; fi
    - id: stepCheck
      name: Checking presence of CI target for current job
      run: |
        if $(cat out err | grep -q "built:") ; then
          echo "CI target needs actual building"
          if $(cat out err | grep -q "derivations will be built:") ; then
            echo "waiting a bit for derivations that should be in cache"
            sleep 30
          fi
        else
          echo "CI target already built"
          echo "status=fetched" >> $GITHUB_OUTPUT
        fi
    - if: steps.stepCheck.outputs.status != 'fetched'
      name: 'Building/fetching previous CI target: coq'
      run: NIXPKGS_ALLOW_UNFREE=1 /tmp/builder.sh --no-out-link --argstr bundle "9.2"
        --argstr job "coq"
    - if: steps.stepCheck.outputs.status != 'fetched'
      name: 'Building/fetching previous CI target: equations'
      run: NIXPKGS_ALLOW_UNFREE=1 /tmp/builder.sh --no-out-link --argstr bundle "9.2"
        --argstr job "equations"
    - if: steps.stepCheck.outputs.status != 'fetched'
      name: 'Building/fetching previous CI target: metarocq-erasure-plugin'
      run: NIXPKGS_ALLOW_UNFREE=1 /tmp/builder.sh --no-out-link --argstr bundle "9.2"
        --argstr job "metarocq-erasure-plugin"
    - if: steps.stepCheck.outputs.status != 'fetched'
      name: 'Building/fetching previous CI target: ceres-bs'
      run: NIXPKGS_ALLOW_UNFREE=1 /tmp/builder.sh --no-out-link --argstr bundle "9.2"
        --argstr job "ceres-bs"
    - if: steps.stepCheck.outputs.status != 'fetched'
      name: Building/fetching current CI target
      run: NIXPKGS_ALLOW_UNFREE=1 /tmp/builder.sh --no-out-link --argstr bundle "9.2"
        --argstr job "CakeMLExtraction"
